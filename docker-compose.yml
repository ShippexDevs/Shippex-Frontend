services:

  frontend:
    build:
      context: .

    container_name: shippex-frontend

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}

    restart: unless-stopped
